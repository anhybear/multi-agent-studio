<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Multi-Agent Studio — Learn to Direct AI Teams</title>
<style>
:root{
  --paper:#f7f4ee; --paper2:#fffdf8; --ink:#1c1b29; --ink2:#4a4860; --muted:#7b7990;
  --line:#e6e0d4; --line2:#d8d2c4;
  --indigo:#5a3cf0; --indigo-soft:#ece8ff; --indigo-ink:#3a25b8;
  --teal:#0e8f8a; --teal-soft:#dff4f2;
  --amber:#c9821a; --amber-soft:#fbeedb;
  --rose:#c8366b; --rose-soft:#fbe4ec;
  --green:#2f8f4e; --green-soft:#e2f3e7;
  --code-bg:#1b1a2b; --code-ink:#e7e4f7;
  --shadow:0 1px 2px rgba(28,27,41,.06), 0 8px 30px rgba(28,27,41,.06);
  --shadow-lg:0 20px 60px rgba(28,27,41,.16);
  --serif:'Iowan Old Style','Palatino Linotype','Palatino',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono','Menlo','Cascadia Code','Consolas',monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;}
a{color:var(--indigo-ink);text-decoration:none}
::selection{background:#d9cfff}

/* layout */
#app{display:flex;min-height:100vh}
#sidebar{width:296px;flex:0 0 296px;background:var(--paper2);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 18px 40px;z-index:30}
#main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:820px;padding:0 28px 120px}

/* brand */
.brand{display:flex;align-items:center;gap:11px;margin:2px 6px 18px;cursor:pointer}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--indigo),#8b6dff);
  flex:0 0 34px;position:relative;box-shadow:0 4px 14px rgba(90,60,240,.4)}
.brand .mark::before,.brand .mark::after{content:"";position:absolute;border-radius:50%;background:#fff}
.brand .mark::before{width:7px;height:7px;top:8px;left:8px;box-shadow:12px 0 #fff,0 12px #fff,12px 12px #fff}
.brand .mark::after{width:18px;height:18px;border:1.6px solid rgba(255,255,255,.55);background:transparent;border-radius:5px;top:8px;left:8px}
.brand h1{font-family:var(--serif);font-size:18px;margin:0;line-height:1.15;font-weight:700;letter-spacing:-.2px}
.brand p{margin:0;font-size:11px;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}

/* progress meter */
.meter{margin:0 6px 16px;font-size:12px;color:var(--muted)}
.meter .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),#9a7dff);width:0;transition:width .5s}

/* nav */
.nav-part{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);
  margin:18px 8px 7px;display:flex;align-items:center;gap:8px}
.nav-part span{flex:1;height:1px;background:var(--line)}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;
  color:var(--ink2);font-size:14.5px;line-height:1.3;transition:background .15s,color .15s;margin:1px 0}
.nav-item:hover{background:var(--indigo-soft);color:var(--ink)}
.nav-item.active{background:var(--indigo);color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(90,60,240,.32)}
.nav-item.active .dot{border-color:#fff}
.nav-item .dot{width:16px;height:16px;flex:0 0 16px;border-radius:50%;border:2px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:10px;transition:.15s}
.nav-item .dot.done{background:var(--green);border-color:var(--green);color:#fff}
.nav-item.active .dot.done{background:#fff;color:var(--green);border-color:#fff}
.nav-num{font-size:11px;color:var(--muted);width:14px;text-align:center}
.nav-item.active .nav-num{color:rgba(255,255,255,.8)}

.sidebar-foot{margin:22px 8px 0;font-size:11.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:14px}
.sidebar-foot b{color:var(--ink2)}

/* mobile */
#menuBtn{display:none;position:fixed;top:14px;left:14px;z-index:50;background:var(--ink);color:#fff;border:none;
  width:44px;height:44px;border-radius:12px;font-size:20px;cursor:pointer;box-shadow:var(--shadow-lg)}
#scrim{display:none;position:fixed;inset:0;background:rgba(20,18,30,.45);z-index:25}

/* hero / home */
.hero{padding:64px 0 30px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--indigo-ink);background:var(--indigo-soft);padding:6px 13px;border-radius:99px;margin-bottom:22px}
.hero h1{font-family:var(--serif);font-size:54px;line-height:1.04;margin:0 0 18px;letter-spacing:-1.2px;font-weight:800}
.hero h1 em{font-style:italic;color:var(--indigo)}
.hero .lede{font-size:21px;color:var(--ink2);line-height:1.5;max-width:640px;margin:0 0 14px}
.hero .sub{font-size:16px;color:var(--muted);max-width:620px}

h2.sec{font-family:var(--serif);font-size:30px;letter-spacing:-.5px;margin:46px 0 8px;font-weight:700}
h3.sub{font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:34px 0 12px}
p{margin:0 0 16px}
.lesson-body p,.lesson-body li{font-size:17px}
.lesson-body strong{color:var(--ink)}
.lesson-body ul{margin:0 0 16px;padding-left:22px}
.lesson-body li{margin:0 0 7px}

/* lesson header */
.lhead{padding:44px 0 8px;border-bottom:1px solid var(--line);margin-bottom:30px}
.lhead .crumb{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--indigo);margin-bottom:12px;display:flex;gap:10px;align-items:center}
.lhead .crumb .chip{background:var(--indigo-soft);padding:3px 9px;border-radius:6px;color:var(--indigo-ink)}
.lhead h1{font-family:var(--serif);font-size:42px;line-height:1.08;margin:0 0 12px;letter-spacing:-.8px;font-weight:800}
.lhead .tag{font-size:15px;color:var(--ink2);max-width:620px}
.lhead .time{font-size:13px;color:var(--muted);margin-top:14px}

/* cards / callouts */
.card{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin:22px 0;box-shadow:var(--shadow)}
.callout{border-radius:14px;padding:18px 20px 18px 22px;margin:22px 0;position:relative;border:1px solid var(--line);background:var(--paper2)}
.callout .ctitle{font-weight:700;font-size:13px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.callout p:last-child{margin-bottom:0}
.callout.analogy{background:var(--amber-soft);border-color:#f0dcc0}
.callout.analogy .ctitle{color:var(--amber)}
.callout.key{background:var(--indigo-soft);border-color:#ddd5ff}
.callout.key .ctitle{color:var(--indigo-ink)}
.callout.warn{background:var(--rose-soft);border-color:#f3cdda}
.callout.warn .ctitle{color:var(--rose)}
.callout.tip{background:var(--teal-soft);border-color:#c4e7e4}
.callout.tip .ctitle{color:var(--teal)}

/* concept grid */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}
.cgrid .ccard{background:var(--paper2);border:1px solid var(--line);border-radius:13px;padding:16px 18px}
.cgrid .ccard h4{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:8px}
.cgrid .ccard p{margin:0;font-size:14.5px;color:var(--ink2);line-height:1.5}
.cgrid .ccard .ic{width:26px;height:26px;border-radius:7px;background:var(--indigo-soft);color:var(--indigo-ink);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 26px}

/* langgraph panel */
.lg{border:1px solid #cdbfff;border-radius:16px;margin:26px 0;overflow:hidden;background:var(--paper2)}
.lg .lg-head{background:linear-gradient(135deg,#efeaff,#f6f3ff);padding:12px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd5ff}
.lg .lg-head .lg-logo{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--indigo-ink);background:#fff;border:1px solid #d6ccff;padding:3px 9px;border-radius:6px}
.lg .lg-head .lg-t{font-weight:700;font-size:14.5px}
.lg .lg-body{padding:18px 20px}
.lg .lg-body p{font-size:15px;color:var(--ink2)}
.maprow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.maprow:last-child{border-bottom:none}
.maprow .b{font-weight:600;color:var(--ink);flex:0 0 44%}
.maprow .arrow{color:var(--indigo);font-weight:700}
.maprow .l{font-family:var(--mono);font-size:13px;color:var(--indigo-ink);background:var(--indigo-soft);padding:2px 8px;border-radius:6px}

/* code */
pre{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:16px 18px;overflow-x:auto;
  font-family:var(--mono);font-size:13px;line-height:1.6;margin:16px 0}
pre .c{color:#8a86b8}/* comment */
pre .k{color:#c792ea}/* keyword */
pre .s{color:#c3e88d}/* string */
pre .f{color:#82aaff}/* func */
code.inl{font-family:var(--mono);font-size:.9em;background:#efeaff;color:var(--indigo-ink);padding:1px 6px;border-radius:5px}

/* go deeper */
.deeper{border:1px solid var(--line);border-radius:12px;margin:18px 0;overflow:hidden;background:var(--paper2)}
.deeper summary{cursor:pointer;padding:13px 18px;font-weight:600;font-size:14.5px;list-style:none;display:flex;align-items:center;gap:9px;color:var(--ink2)}
.deeper summary::-webkit-details-marker{display:none}
.deeper summary .tw{transition:transform .2s;color:var(--indigo)}
.deeper[open] summary .tw{transform:rotate(90deg)}
.deeper summary:hover{background:var(--paper)}
.deeper .dbody{padding:4px 20px 18px;border-top:1px solid var(--line)}
.deeper .dbody p{font-size:14.5px;color:var(--ink2)}

/* director prompt */
.director{background:linear-gradient(135deg,#1b1a2b,#252339);color:#ece9fb;border-radius:16px;padding:22px 24px;margin:26px 0;box-shadow:var(--shadow-lg)}
.director .dh{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:#b9acff;margin-bottom:6px}
.director h4{margin:0 0 12px;font-family:var(--serif);font-size:21px;color:#fff;font-weight:700}
.director p{color:#c9c4e8;font-size:14.5px}
.director .promptbox{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:11px;
  padding:15px 17px;font-family:var(--mono);font-size:12.8px;line-height:1.6;color:#e3dffb;white-space:pre-wrap;position:relative}
.director .copy{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.12);border:none;color:#cfc8f5;
  font-size:11px;padding:5px 10px;border-radius:7px;cursor:pointer;font-family:var(--sans);font-weight:600}
.director .copy:hover{background:rgba(255,255,255,.22)}

/* quiz */
.quiz{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin:26px 0;box-shadow:var(--shadow)}
.quiz .qh{font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--green);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.quiz .q{font-size:18px;font-weight:600;margin-bottom:14px;font-family:var(--serif)}
.quiz .opt{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:11px;
  padding:12px 15px;margin:8px 0;cursor:pointer;font-size:15px;color:var(--ink);transition:.15s;font-family:inherit}
.quiz .opt:hover{border-color:var(--indigo);background:var(--indigo-soft)}
.quiz .opt.correct{border-color:var(--green);background:var(--green-soft);font-weight:600}
.quiz .opt.wrong{border-color:var(--rose);background:var(--rose-soft)}
.quiz .opt:disabled{cursor:default}
.quiz .fb{margin-top:12px;font-size:14.5px;padding:12px 15px;border-radius:10px;display:none}
.quiz .fb.show{display:block}
.quiz .fb.ok{background:var(--green-soft);color:#1f6b38}
.quiz .fb.no{background:var(--rose-soft);color:#9e2850}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--indigo);color:#fff;border:none;border-radius:11px;
  padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;box-shadow:0 6px 18px rgba(90,60,240,.3)}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(90,60,240,.4)}
.btn.ghost{background:transparent;color:var(--indigo-ink);box-shadow:none;border:1.5px solid var(--line2)}
.btn.ghost:hover{background:var(--indigo-soft);transform:none;box-shadow:none}
.btn.sm{padding:8px 15px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}

/* footer nav */
.lnav{display:flex;justify-content:space-between;gap:14px;margin:50px 0 0;border-top:1px solid var(--line);padding-top:26px;align-items:center}
.lnav .l-prev,.lnav .l-next{display:flex;flex-direction:column;cursor:pointer;padding:14px 18px;border-radius:13px;border:1px solid var(--line);background:var(--paper2);transition:.15s;max-width:46%}
.lnav .l-prev:hover,.lnav .l-next:hover{border-color:var(--indigo);background:var(--indigo-soft)}
.lnav .l-next{text-align:right;align-items:flex-end}
.lnav small{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
.lnav b{font-size:15px;color:var(--ink);font-weight:600}
.complete-btn{margin:30px auto 0;display:flex;justify-content:center}

/* widgets — generic */
.widget{border:1px solid var(--line2);border-radius:18px;margin:28px 0;background:linear-gradient(180deg,#fffdf8,#f8f5ef);box-shadow:var(--shadow);overflow:hidden}
.widget .wbar{padding:13px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--paper2)}
.widget .wbar .wd{width:9px;height:9px;border-radius:50%;background:var(--indigo);box-shadow:0 0 0 4px var(--indigo-soft)}
.widget .wbar .wt{font-weight:700;font-size:13px;letter-spacing:.4px}
.widget .wbar .wsub{font-size:12px;color:var(--muted);margin-left:auto}
.widget .wbody{padding:22px}

/* agent loop widget */
.loopwrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.loopstage{position:relative;width:280px;height:280px}
.loopnode{position:absolute;width:104px;height:104px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;border:2px solid var(--line2);background:#fff;
  font-size:13px;font-weight:600;transition:.35s;color:var(--ink2)}
.loopnode .ei{font-size:22px;margin-bottom:2px}
.loopnode.on{border-color:var(--indigo);background:var(--indigo);color:#fff;transform:scale(1.08);box-shadow:0 12px 30px rgba(90,60,240,.4)}
.loopnode.on .small{color:#d8d0ff}
.loopnode .small{font-size:10px;font-weight:500;color:var(--muted)}
.loop-say{min-height:54px;background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;
  font-size:14.5px;color:var(--ink2);width:100%;max-width:420px;text-align:center;transition:.2s}
.loop-say b{color:var(--indigo-ink)}

/* decision tree */
.dt-q{font-family:var(--serif);font-size:21px;font-weight:700;margin-bottom:16px;line-height:1.3}
.dt-opts{display:flex;flex-direction:column;gap:10px}
.dt-opt{text-align:left;background:#fff;border:1.5px solid var(--line2);border-radius:12px;padding:13px 16px;cursor:pointer;
  font-size:15px;font-family:inherit;transition:.15s;color:var(--ink)}
.dt-opt:hover{border-color:var(--indigo);background:var(--indigo-soft)}
.dt-result{text-align:center;padding:10px 0}
.dt-result .badge{display:inline-block;padding:8px 18px;border-radius:99px;font-weight:700;font-size:14px;letter-spacing:.4px;margin-bottom:14px}
.dt-result h3{font-family:var(--serif);font-size:26px;margin:0 0 10px}
.dt-result p{font-size:15px;color:var(--ink2);max-width:480px;margin:0 auto 8px}
.dt-path{font-size:12.5px;color:var(--muted);margin-top:14px;font-style:italic}

/* pattern gallery */
.pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.pcard{border:1.5px solid var(--line2);border-radius:14px;padding:14px;cursor:pointer;background:#fff;transition:.15s;text-align:center}
.pcard:hover{border-color:var(--indigo);transform:translateY(-2px);box-shadow:var(--shadow)}
.pcard.sel{border-color:var(--indigo);background:var(--indigo-soft)}
.pcard svg{width:100%;height:78px;margin-bottom:8px}
.pcard .pn{font-weight:700;font-size:14px;margin-bottom:2px}
.pcard .pk{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.pdetail{margin-top:16px;border-top:1px solid var(--line);padding-top:16px;display:none}
.pdetail.show{display:block}
.pdetail h4{font-family:var(--serif);font-size:20px;margin:0 0 4px}
.ptag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;margin-bottom:10px;letter-spacing:.4px}
.pmeta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pmeta span{font-size:12px;background:var(--paper);border:1px solid var(--line);padding:4px 10px;border-radius:7px;color:var(--ink2)}
.pmeta span b{color:var(--ink)}

/* risk classifier */
.rc-pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;justify-content:center}
.rc-chip{padding:8px 14px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;font-size:13.5px;cursor:pointer;transition:.15s;font-weight:500}
.rc-chip:hover{border-color:var(--indigo)}
.rc-chip.placed{opacity:.35;pointer-events:none;text-decoration:line-through}
.rc-bins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc-bin{border:2px dashed var(--line2);border-radius:14px;padding:14px;min-height:120px}
.rc-bin.low{border-color:#9bd3ab;background:var(--green-soft)}
.rc-bin.high{border-color:#eaa9c1;background:var(--rose-soft)}
.rc-bin h4{margin:0 0 4px;font-size:15px}
.rc-bin .hint{font-size:12px;color:var(--ink2);margin-bottom:10px}
.rc-bin .drop{display:flex;flex-wrap:wrap;gap:6px}
.rc-bin .drop .pl{font-size:12.5px;padding:5px 10px;border-radius:8px;background:#fff;border:1px solid var(--line)}
.rc-bin .drop .pl.ok{border-color:var(--green)}
.rc-bin .drop .pl.bad{border-color:var(--rose);text-decoration:line-through;opacity:.7}
.rc-active{outline:3px solid var(--indigo);outline-offset:2px;border-radius:10px}

/* graph tracer */
.gt-wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.gt-canvas{position:relative;background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:8px;min-height:340px}
.gt-state{background:var(--code-bg);color:var(--code-ink);border-radius:14px;padding:16px;font-family:var(--mono);font-size:12.5px;line-height:1.7}
.gt-state .sk{color:#82aaff}.gt-state .sv{color:#c3e88d}.gt-state .upd{background:rgba(195,232,141,.18);border-radius:3px;animation:flash 1s}
@keyframes flash{0%{background:rgba(195,232,141,.6)}100%{background:rgba(195,232,141,.18)}}
.gt-node{position:absolute;border:2px solid var(--line2);background:#fff;border-radius:11px;padding:9px 12px;font-size:12.5px;
  font-weight:600;text-align:center;transition:.3s;min-width:96px;color:var(--ink2)}
.gt-node.on{border-color:var(--indigo);background:var(--indigo);color:#fff;box-shadow:0 10px 24px rgba(90,60,240,.4);transform:scale(1.05)}
.gt-node.done{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.gt-node .nt{font-size:10px;font-weight:500;opacity:.7;text-transform:uppercase;letter-spacing:.4px}
.gt-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.gt-controls{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.gt-log{font-size:13px;color:var(--ink2);margin-top:10px;min-height:20px}

/* orchestration sim */
.os-top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.os-pat{padding:7px 13px;border-radius:9px;border:1.5px solid var(--line2);background:#fff;font-size:13px;cursor:pointer;font-weight:600;transition:.15s}
.os-pat.sel{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.os-agents{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:6px 0 16px}

<script>
/* ============================================================ DATA */
const PARTS = [
  {id:'I', name:'Part I · Foundations'},
  {id:'II', name:'Part II · Building'},
  {id:'III', name:'Part III · Making it work'},
  {id:'IV', name:'Part IV · The frontier'},
];

/* Lessons: each has render() returning HTML string; widgets mounted after via mount(). */
const LESSONS = [
  /* 1 */ {id:'agent', part:'I', chip:'Lesson 1', title:'Meet the Agent', time:'8 min · the atom of everything',
    tag:'Before “multi-agent” means anything, you need a crisp picture of a single agent — and why it is not the same thing as “an AI model.”'},
  /* 2 */ {id:'oneormany', part:'I', chip:'Lesson 2', title:'One Agent, or a Whole Team?', time:'9 min · choosing your architecture',
    tag:'When does a task actually need multiple agents? You will leave with a decision framework you can run in your head before briefing any coder.'},
  /* 3 */ {id:'patterns', part:'I', chip:'Lesson 3 · core', title:'The Six Ways Agents Work Together', time:'14 min · the heart of the craft',
    tag:'Every multi-agent system you will ever build is one of six orchestration patterns — or a blend. Learn to see them and pick the right one.'},
  /* 4 */ {id:'ux', part:'I', chip:'Lesson 4', title:'Designing for the Human in the Loop', time:'8 min · trust, cost & control',
    tag:'Autonomous systems are unpredictable by nature. Four UX principles keep them trustworthy — and shape what you ask your coder to build around the agents.'},
  /* 5 */ {id:'insideagent', part:'II', chip:'Lesson 5', title:'Inside a Single Agent', time:'11 min · the moving parts',
    tag:'Tools, memory, the execution loop, guardrails, context. The parts you will name when you tell a coder exactly what each agent should be made of.'},
  /* 6 */ {id:'graphs', part:'II', chip:'Lesson 6 · LangGraph', title:'Workflows as Graphs → LangGraph', time:'15 min · the big translation',
    tag:'This is where the book and LangGraph become the same idea. Nodes, edges, shared state, checkpoints — explained, then mapped one-to-one onto real LangGraph code.'},
  /* 7 */ {id:'orchestration', part:'II', chip:'Lesson 7', title:'Autonomous Orchestration', time:'12 min · let the AI drive',
    tag:'When control flow is decided at runtime by an AI, not by you. Watch round-robin, AI-driven and plan-based orchestration run, step by step.'},
  /* 8 */ {id:'frameworks', part:'II', chip:'Lesson 8 · LangGraph', title:'Why a Framework — and LangGraph in Full', time:'12 min · read any LangGraph repo',
    tag:'The ten things a framework gives you, and the complete LangGraph vocabulary — so you can read a LangGraph codebase and know what every piece is doing.'},
  /* 9 */ {id:'failure', part:'III', chip:'Lesson 9', title:'Why Systems Fail (and How to Direct Around It)', time:'13 min · the director’s edge',
    tag:'Ten predictable failure modes from someone who shipped these for years — turned into a diagnostic and a set of briefs you can hand straight to a coding agent.'},
  /* 10 */ {id:'frontier', part:'IV', chip:'Lesson 10', title:'Protocols, Ethics & Real Builds', time:'10 min · the wider world',
    tag:'How agents talk across the internet (MCP & A2A), what responsible deployment means when agents can act, and two complete real-world systems.'},
  /* extras */
  {id:'playbook', part:'IV', chip:'Reference', title:'The Director’s Playbook', time:'cheat sheet',
    tag:'Every “direct your coder” brief from the course, collected in one place. Your launchpad for briefing Codex or Claude Code.'},
  {id:'glossary', part:'IV', chip:'Reference', title:'Glossary', time:'searchable',
    tag:'Plain-language definitions of every term, each tagged with its LangGraph equivalent.'},
];

/* ============================================================ STATE */
const store = {
  get done(){ try{return JSON.parse(localStorage.getItem('mas_done')||'[]')}catch(e){return[]} },
  set done(v){ localStorage.setItem('mas_done', JSON.stringify(v)) },
  complete(id){ const d=this.done; if(!d.includes(id)){d.push(id); this.done=d;} },
  isDone(id){ return this.done.includes(id) }
};
const COUNTABLE = LESSONS.filter(l=>!['playbook','glossary'].includes(l.id)).map(l=>l.id);

/* ============================================================ NAV */
function buildNav(){
  const nav = document.getElementById('navList');
  let html='';
  PARTS.forEach(p=>{
    html += '<div class="nav-part">'+p.name+'<span></span></div>';
    LESSONS.filter(l=>l.part===p.id).forEach((l)=>{
      const idx = LESSONS.indexOf(l);
      const num = COUNTABLE.includes(l.id)? (COUNTABLE.indexOf(l.id)+1) : '·';
      html += '<div class="nav-item" data-id="'+l.id+'" onclick="go(\''+l.id+'\')">'
        + '<span class="dot" data-dot="'+l.id+'"></span>'
        + '<span class="nav-num">'+num+'</span>'
        + '<span>'+l.title+'</span></div>';
    });
  });
  nav.innerHTML = html;
}
function refreshNav(activeId){
  document.querySelectorAll('.nav-item').forEach(n=>{
    n.classList.toggle('active', n.dataset.id===activeId);
  });
  LESSONS.forEach(l=>{
    const dot = document.querySelector('[data-dot="'+l.id+'"]');
    if(!dot) return;
    if(store.isDone(l.id)){ dot.classList.add('done'); dot.innerHTML='✓'; }
    else { dot.classList.remove('done'); dot.innerHTML=''; }
  });
  const n = store.done.filter(id=>COUNTABLE.includes(id)).length;
  document.getElementById('meterTxt').textContent = n+' of '+COUNTABLE.length+' lessons complete';
  document.getElementById('meterBar').style.width = (n/COUNTABLE.length*100)+'%';
}

/* ============================================================ ROUTER */
function go(id){
  if(id==='home'){ renderHome(); refreshNav('home'); }
  else { const l = LESSONS.find(x=>x.id===id); if(!l) return; renderLesson(l); refreshNav(id); }
  window.scrollTo(0,0);
  if(window.innerWidth<=900) closeNav();
  location.hash = id;
}
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h && h!==current) go(h); });
let current='home';

/* ============================================================ HOME */
function renderHome(){
  current='home';
  const c = document.getElementById('content');
  let cards='';
  COUNTABLE.forEach((id,i)=>{
    const l=LESSONS.find(x=>x.id===id);
    cards += '<div class="home-card" onclick="go(\''+id+'\')">'
      +'<div class="hc-n">'+(store.isDone(id)?'✓ COMPLETE · ':'')+'LESSON '+(i+1)+'</div>'
      +'<h3>'+l.title+'</h3><p>'+l.tag+'</p></div>';
  });
  c.innerHTML = `
  <div class="hero">
    <div class="eyebrow">🎬 An interactive studio for non-coders</div>
    <h1>Stop being the bottleneck. Learn to <em>direct</em> AI teams.</h1>
    <p class="lede">You don't need to write the code. You need to understand the <strong>architecture</strong> well enough to tell Codex or Claude Code exactly what to build — and to know when it's building the wrong thing.</p>
    <p class="sub">A hands-on translation of Victor Dibia's <em>Designing Multi-Agent Systems</em> and the LangGraph framework, made for a creative mind. Plain language first, real technical depth on demand, with diagrams you can poke, systems you can run, and briefs you can copy.</p>
    <div style="margin-top:26px"><button class="btn" onclick="go('agent')">Start the journey →</button>
    <button class="btn ghost" style="margin-left:10px" onclick="go('patterns')">Jump to the core lesson</button></div>
  </div>

  <div class="home-feat">
    <div class="feat"><div class="fi">🧩</div><b>See it</b><span>Click-through diagrams of every orchestration pattern.</span></div>
    <div class="feat"><div class="fi">▶️</div><b>Run it</b><span>Watch agent teams "think" step by step — no code, no API key.</span></div>
    <div class="feat"><div class="fi">🎯</div><b>Direct it</b><span>Copy-ready briefs for your coding agent in every lesson.</span></div>
  </div>

  <h2 class="sec">The journey</h2>
  <p style="color:var(--ink2)">Ten lessons across four parts — from "what is an agent" all the way to running, debugging and shipping real systems. Take them in order, or wander.</p>
  <div class="home-grid">${cards}</div>

  <div class="callout tip" style="margin-top:30px">
    <div class="ctitle">🧭 How to use this</div>
    <p>Read the plain-language part. Poke the interactive bits. Open <b>“Go deeper”</b> only when you're curious about the real mechanics. End each lesson by reading the <b>director's brief</b> — that's the bit that makes you better at telling an AI what to build. Your progress saves automatically in this browser.</p>
  </div>`;
}

/* ============================================================ LESSON SHELL */
function renderLesson(l){
  current=l.id;
  const c=document.getElementById('content');
  const body = CONTENT[l.id] ? CONTENT[l.id]() : '<p>Coming soon.</p>';
  const idx = COUNTABLE.indexOf(l.id);
  let footer='';
  if(!['playbook','glossary'].includes(l.id)){
    const prev = idx>0 ? LESSONS.find(x=>x.id===COUNTABLE[idx-1]) : null;
    const next = idx<COUNTABLE.length-1 ? LESSONS.find(x=>x.id===COUNTABLE[idx+1]) : LESSONS.find(x=>x.id==='playbook');
    footer = '<div class="complete-btn"><button class="btn" id="completeBtn" onclick="markDone(\''+l.id+'\')">'
      + (store.isDone(l.id)?'✓ Completed — revisit anytime':'Mark this lesson complete')+'</button></div>'
      + '<div class="lnav">'
      + (prev?'<div class="l-prev" onclick="go(\''+prev.id+'\')"><small>← Previous</small><b>'+prev.title+'</b></div>':'<div></div>')
      + (next?'<div class="l-next" onclick="go(\''+next.id+'\')"><small>Next →</small><b>'+next.title+'</b></div>':'<div></div>')
      + '</div>';
  }
  c.innerHTML = `
  <div class="lhead">
    <div class="crumb"><span class="chip">${l.chip}</span> ${PARTS.find(p=>p.id===l.part).name}</div>
    <h1>${l.title}</h1>
    <div class="tag">${l.tag}</div>
    <div class="time">⏱ ${l.time}</div>
  </div>
  <div class="lesson-body">${body}</div>
  ${footer}`;
  // mount interactive widgets present in this lesson
  if(MOUNTS[l.id]) MOUNTS[l.id]();
}
function markDone(id){ store.complete(id); refreshNav(id);
  const b=document.getElementById('completeBtn'); if(b){b.textContent='✓ Completed — revisit anytime';}
}

/* helper for copy buttons */
function copyPrompt(btn){
  const box = btn.parentElement;
  const txt = box.innerText.replace(/^Copy\s*/,'').trim();
  navigator.clipboard.writeText(txt).then(()=>{ btn.textContent='Copied ✓'; setTimeout(()=>btn.textContent='Copy',1500); });
}

/* ============================================================ REUSABLE BUILDERS */
function quiz(qid, question, opts, correct, fbOk, fbNo){
  let o='';
  opts.forEach((t,i)=> o+='<button class="opt" onclick="answer(this,'+i+','+correct+',\''+qid+'\')">'+t+'</button>');
  return '<div class="quiz" data-q="'+qid+'"><div class="qh">✦ Checkpoint</div><div class="q">'+question+'</div>'
    +o+'<div class="fb ok" data-fb="ok">'+fbOk+'</div><div class="fb no" data-fb="no">'+fbNo+'</div></div>';
}
function answer(btn, i, correct, qid){
  const box = btn.closest('.quiz');
  box.querySelectorAll('.opt').forEach((b,j)=>{ b.disabled=true; if(j===correct)b.classList.add('correct'); });
  if(i!==correct) btn.classList.add('wrong');
  box.querySelector(i===correct?'[data-fb="ok"]':'[data-fb="no"]').classList.add('show');
}
function director(title, intro, prompt){

    +'<div class="promptbox"><button class="copy" onclick="copyPrompt(this)">Copy</button>'+prompt+'</div></div>';
}
function deeper(title, html){
  return '<details class="deeper"><summary><span class="tw">▶</span>'+title+'</summary><div class="dbody">'+html+'</div></details>';
}
function lgPanel(intro, rows, code){
  let r='';
  rows.forEach(x=> r+='<div class="maprow"><span class="b">'+x[0]+'</span><span class="arrow">→</span><span class="l">'+x[1]+'</span></div>');
  return '<div class="lg"><div class="lg-head"><span class="lg-logo">LangGraph</span><span class="lg-t">How this looks in real code</span></div>'
    +'<div class="lg-body"><p>'+intro+'</p>'+r+(code?code:'')+'</div></div>';
}
</script>

<script>
/* ============================================================ LESSON CONTENT */
const CONTENT = {};

/* ---------- L1: Meet the Agent ---------- */
CONTENT.agent = () => `
<div class="callout analogy"><div class="ctitle">🎨 The intuition</div>
<p>Think of a <b>model</b> (like GPT or Claude on its own) as a brilliant copywriter locked in a room with no phone, no internet, and no memory of yesterday. Ask a question and you get a beautifully written answer — but only from what they already knew. An <b>agent</b> is that same copywriter given a desk, a phone, a filing cabinet, and permission to actually <i>do things</i>: look things up, make calls, check their work, and try again if it's wrong.</p></div>

<p>That's the whole leap. Dibia defines an agent as an entity that can <strong>reason, act, communicate, and adapt</strong> to solve problems. A model just generates text. An agent uses a model as its brain but adds the ability to affect the world and respond to what comes back.</p>

<div class="widget" id="loopWidget">
  <div class="wbar"><span class="wd"></span><span class="wt">The agent loop</span><span class="wsub">press play</span></div>
  <div class="wbody"><div class="loopwrap">
    <div class="loopstage" id="loopStage"></div>
    <div class="loop-say" id="loopSay">An agent doesn't answer once — it runs a loop until the job is done. Hit play.</div>
    <button class="btn sm" id="loopBtn" onclick="playLoop()">▶ Play the loop</button>
  </div></div>
</div>

<p>Unlike a model that produces one response, an agent works in <strong>iterative cycles</strong>: it takes an action, perceives the result, and adapts — over and over — until the task is resolved. Dibia calls this the <em>action–perception loop</em>. It's the single most important mental model in this whole subject, because a "multi-agent system" is just several of these loops coordinated together.</p>

<h3 class="sub">The four capabilities</h3>
<div class="cgrid">
  <div class="ccard"><h4><span class="ic">🧠</span>Reason</h4><p>Work out what to do next. "‘NVIDIA today' means I need live market data, not what I remember from training."</p></div>
  <div class="ccard"><h4><span class="ic">⚡</span>Act</h4><p>Do something concrete — call an API, search the web, run code, send a file. Not just talk about it.</p></div>
  <div class="ccard"><h4><span class="ic">💬</span>Communicate</h4><p>Exchange information with you, with other agents, and with external systems — and ask for clarification.</p></div>
  <div class="ccard"><h4><span class="ic">🔄</span>Adapt</h4><p>Hit a rate limit? Wait and retry, switch data sources, or rethink the approach based on the error.</p></div>
</div>

<h3 class="sub">An agent is made of three parts</h3>
<p>Whenever you brief a coder to "build an agent," you're really specifying these three things:</p>
<div class="cgrid">
  <div class="ccard"><h4><span class="ic">🧠</span>Model</h4><p>The reasoning engine (the LLM). The "brain" that decides what to do next.</p></div>
  <div class="ccard"><h4><span class="ic">🔧</span>Tools</h4><p>The things it can actually <i>do</i> — search, send email, query a database. Tools define its "action space."</p></div>
  <div class="ccard"><h4><span class="ic">📚</span>Memory</h4><p>What it can recall — recent conversation (short-term) and accumulated knowledge across sessions (long-term).</p></div>
</div>

${deeper('Go deeper: where the loop came from, and "conversational programming"', `
<p>The action–perception loop isn't new — it traces back to classic AI (Russell &amp; Norvig): an agent perceives its environment through sensors and acts through actuators. A robot vacuum is the toy example: sense obstacle → turn; sense dirt → suck; sense low battery → dock. Generative-AI agents keep that exact cycle but swap the rigid rules for an LLM that can reason in natural language and adapt.</p>
<p><b>Conversational programming</b> is the trick that makes this practical in code: every step of the loop — the agent's thought, its action, the tool's result — is represented as a <i>message in a conversation</i>. Modern chat models are trained on exactly this format, so the loop becomes "append a message, ask the model what's next, append the result, repeat." Hold onto this idea — in Lesson 6 you'll see the conversation itself becomes the shared <i>state</i> that a whole team of agents reads and writes.</p>`)}

${lgPanel(
  'You will rarely hand-write the loop. In LangGraph the prebuilt <code class="inl">create_react_agent</code> gives you a full reason→act→observe loop in one line — you just supply the brain (model), the hands (tools), and optionally the memory.',
  [['The agent loop','create_react_agent(model, tools)'],['Model (the brain)','model="..." / a chat model'],['Tools (the hands)','tools=[search, send_email]'],['Memory (short-term)','checkpointer=InMemorySaver()']],
  '<pre><span class="c"># A complete single agent — loop included</span>\n<span class="k">from</span> langgraph.prebuilt <span class="k">import</span> <span class="f">create_react_agent</span>\n\nagent = <span class="f">create_react_agent</span>(\n    model=<span class="s">"openai:gpt-4.1"</span>,\n    tools=[search_web, check_brand_guidelines],\n    prompt=<span class="s">"You are a brand researcher. Always cite sources."</span>,\n)\nresult = agent.<span class="f">invoke</span>({<span class="s">"messages"</span>: [(<span class="s">"user"</span>, <span class="s">"Research Patagonia\'s tone of voice"</span>)]})</pre>')}

${quiz('q-agent','You ask a tool to "tell me today\'s top trending TikTok sound." What makes this a job for an <i>agent</i> and not just a model?',

CONTENT.insideagent = () => `
<div class="callout analogy"><div class="ctitle">🎨 The intuition</div>
<p>In Lesson 1 we said an agent is brain + tools + memory. Now we open the hood. Think of it like spec-ing out a new hire's setup: what software do they get (tools), what filing system (memory), what's the standard operating procedure when they hit a wall (the loop), what needs manager sign-off (guardrails), and how much can we cram on their desk before they get overwhelmed (context)?</p></div>

<p>This lesson is your vocabulary for describing <b>what an individual agent is made of</b>. You won't build it by hand — but naming these parts precisely is what separates a brief that produces a reliable agent from one that produces a confused one.</p>

<h3 class="sub">1 · The execution loop</h3>
<p>Under the hood, every agent runs the loop from Lesson 1: think → call a tool → read the result → repeat → answer. Good implementations <b>stream</b> these steps as they happen (so you see progress), and support <b>cancellation</b> (so you can stop a runaway). When you hear "agent loop," picture that cycle turning.</p>

<h3 class="sub">2 · Tools — the action space</h3>
<p>Tools are the single biggest lever on what an agent can reliably do. Dibia's rule is blunt and worth memorising: <strong>reliability over breadth — 10 excellent tools beat 50 mediocre ones.</strong> Too many tools and the agent gets confused and fills its context with clutter. Tools come in two flavours: <i>general-purpose</i> (a code runner, a browser) and <i>domain-specific</i> (your "check brand guidelines" API).</p>
<div class="callout tip"><div class="ctitle">💡 The "think tool" trick</div><p>One surprisingly powerful tool is a <b>structured-reasoning tool</b> the agent calls to plan before acting. Anthropic's research showed it can improve performance meaningfully on complex tasks. It's a recurring theme: sometimes the best "action" is structured thought.</p></div>

<h3 class="sub">3 · Memory — short, long, and who controls it</h3>
<div class="cgrid">
  <div class="ccard"><h4>🕐 Short-term</h4><p>Working memory for the current task — the conversation so far. In a team, this is the <i>shared context</i> agents coordinate through.</p></div>
  <div class="ccard"><h4>🗄️ Long-term</h4><p>Knowledge that persists across sessions — usually via <b>RAG</b>: store info as searchable vectors, retrieve the relevant bits on demand.</p></div>
  <div class="ccard"><h4>🛠️ Application-managed</h4><p>Your code decides what to store and retrieve, automatically. Predictable.</p></div>
  <div class="ccard"><h4>🤖 Agent-managed</h4><p>The agent decides, using memory <i>tools</i> — it curates its own knowledge. More autonomous.</p></div>
</div>
<p style="font-size:14.5px;color:var(--ink2)">Not every agent needs long-term memory — stateless agents are simpler and faster. Add memory only when "remembering" measurably improves results (Lesson 9 returns to this).</p>

<h3 class="sub">4 · Guardrails &amp; humans in the loop</h3>
<p>Two control layers wrap the agent: <b>middleware</b> (code that runs before/after each step — for logging, safety checks, redaction) and <b>human approval</b> for high-cost tool calls (the cost-aware delegation from Lesson 4). Observability tooling like <b>OpenTelemetry</b> traces every step so you can debug and audit.</p>

<h3 class="sub">5 · Context engineering</h3>
<div class="callout warn"><div class="ctitle">⚠️ The hidden killer: context rot</div>
<p>An agent's context window is finite. Stuff too much in — long histories, bloated tool outputs, every memory — and quality <i>degrades</i> ("context rot" / "context explosion"). <b>Context engineering</b> is the discipline of feeding the agent only what it needs, when it needs it: summarising old history, trimming tool outputs, retrieving memories selectively. It's the agent-design equivalent of a tight creative brief — less, but the right less.</p></div>

${deeper('Go deeper: "agents as tools," the recursion that powers big systems', `
<p>Here's the elegant trick that makes the "agents all the way down" idea from Lesson 3 concrete: <b>an entire agent can be wrapped up and handed to another agent as if it were a single tool.</b></p>
<p>So a "lead" agent might have a tool called <code class="inl">research_team</code> — and calling it actually runs a whole sub-team. The lead doesn't know or care about the internal complexity; it just sees a tool that returns a result. This is exactly how the handoff pattern (Lesson 3) is implemented, and how systems like Anthropic's research system spin up many sub-agents on demand. Tools, agents, and teams become interchangeable building blocks.</p>`)}

${lgPanel(

${quiz('q-inside','Your agent keeps "forgetting" instructions you gave it 20 messages ago and its answers are getting worse the longer it runs. Most likely cause?',

<h3 class="sub">The four ideas you just watched</h3>
<ul>
<li><b>Nodes (Steps):</b> each does one unit of work — takes the state in, returns an update to it.</li>
<li><b>Edges:</b> the arrows. A plain edge always fires; a <b>conditional edge</b> looks at the state and <i>chooses</i> the next node (that's branching, supervisors, and routing — all the same mechanism).</li>
<li><b>Shared state:</b> the single object that flows through the graph. Nodes don't shout at each other; they read and write this shared "whiteboard." This is the most important concept in LangGraph.</li>
<li><b>Build vs. run:</b> first you <i>construct</i> the graph (wire nodes + edges), then you <i>compile</i> it into something runnable, then you run it. Construction and execution are separate phases — which is why it can be validated and visualised before it ever runs.</li>

<p>In LangGraph, agents don't pass messages directly to each other. They all read from and write to <b>one shared state object</b>. A "reducer" decides <i>how</i> updates merge — e.g. new messages get <b>appended</b> to the list (not overwritten). Once this clicks, every LangGraph codebase suddenly makes sense.</p></div>

pan class="f">add_edge</span>(START, <span class="s">"research"</span>)\nbuilder.<span class="f">add_edge</span>(<span class="s">"research"</span>, <span class="s">"ideate"</span>)\nbuilder.<span class="f">add_conditional_edges</span>(<span class="s">"ideate"</span>, needs_legal)  <span class="c"># branch!</span>\nbuilder.<span class="f">add_edge</span>(<span class="s">"legal"</span>, END)\n\n<span class="c"># 5) Compile (build->run boundary), then run</span>\ngraph = builder.<span class="f">compile</span>()\nresult = graph.<span class="f">invoke</span>({<span class="s">"brief"</span>: <span class="s">"launch the spring line"</span>})</pre>')}

${deeper('Go deeper: checkpointing, the feature that makes it production-grade', `
<p>When you compile with a <b>checkpointer</b>, LangGraph saves the entire state after every step, keyed by a <code class="inl">thread_id</code>. This one feature unlocks a surprising amount:</p>
<ul>
<li><b>Memory across turns:</b> the same thread remembers the conversation — that's how a chatbot has continuity.</li>
<li><b>Pause &amp; resume:</b> the <code class="inl">interrupt()</code> from Lesson 4 works because state is saved; a human can approve hours later and it picks up exactly where it stopped.</li>
<li><b>Crash recovery &amp; scale:</b> if a server dies mid-run, another can reload the state and continue. Dibia calls this "stateless horizontal scaling" — the state lives in storage, not in the running process.</li>
</ul>
<pre><span class="k">from</span> langgraph.checkpoint.memory <span class="k">import</span> InMemorySaver

<p>The engine behind all autonomous patterns is an <strong>orchestrator loop</strong>: pick who acts next → let them act → add their output to the shared conversation → check if we should stop → repeat. The only thing that changes between patterns is <b>how "who's next" is decided</b>. Run them and watch:</p>

<h3 class="sub">The three you just ran</h3>
<div class="cgrid">

<div class="callout key"><div class="ctitle">🛑 The non-negotiable: termination</div>
<p>Autonomous loops will run forever (and bill you forever) without a <b>termination condition</b>. Every simulation above stopped because of one. In practice you compose several: "stop after N messages OR when an agent signals the task is complete OR when a human says stop." Forgetting this is one of the most expensive mistakes in the field — Lesson 9 has the war stories.</p></div>

${deeper('Go deeper: plan-based orchestration and "metacognition"', `
<p>Plan-based is the most sophisticated autonomous pattern, and it powers some famous systems. The orchestrator: (1) generates an explicit plan, (2) assigns step 1 to the right agent with only the context it needs, (3) <b>evaluates whether that step actually succeeded</b>, and (4) either proceeds, retries with better instructions, or re-plans. That self-evaluation step is <b>metacognition</b> — the system thinking about its own progress.</p>

/* ---- L4: risk classifier ---- */
const RC_ITEMS = [
  {t:'Search the web for trends', r:'low'},
  {t:'Read a file', r:'low'},
  {t:'Summarise an email', r:'low'},
  {t:'Calculate a budget', r:'low'},
  {t:'Send an email to a client', r:'high'},
  {t:'Delete database records', r:'high'},
  {t:'Make a payment', r:'high'},
  {t:'Post to the brand\'s social account', r:'high'},
];
let rcActive=null, rcDone=0;
MOUNTS.ux = () => {
  rcActive=null; rcDone=0;
  const m=document.getElementById('rcMount');
  const chips=RC_ITEMS.map((it,i)=>'<button class="rc-chip" data-i="'+i+'" onclick="rcPick('+i+')">'+it.t+'</button>').join('');
  m.innerHTML='<div class="rc-pool" id="rcPool">'+chips+'</div>'
    +'<div class="rc-bins">'
    +'<div class="rc-bin low" id="binlow" onclick="rcDrop(\'low\')"><h4>✅ Safe to auto-run</h4><div class="hint">Low cost: read-only, reversible</div><div class="drop" id="droplow"></div></div>'
    +'<div class="rc-bin high" id="binhigh" onclick="rcDrop(\'high\')"><h4>🔒 Ask me first</h4><div class="hint">High cost: irreversible, costly, or sensitive</div><div class="drop" id="drophigh"></div></div>'
    +'</div><div id="rcMsg" style="text-align:center;margin-top:14px;font-size:14px;color:var(--muted)">Tap an action, then tap the bin you think it belongs in.</div>';
};
function rcPick(i){
  rcActive=i;
  document.querySelectorAll('.rc-chip').forEach(c=>c.classList.toggle('rc-active', +c.dataset.i===i));
  document.getElementById('rcMsg').textContent='Now tap a bin for: "'+RC_ITEMS[i].t+'"';
}
function rcDrop(bin){
  if(rcActive===null){ document.getElementById('rcMsg').textContent='Tap an action first ↑'; return; }
  const it=RC_ITEMS[rcActive]; const correct=(it.r===bin);
  const chip=document.querySelector('.rc-chip[data-i="'+rcActive+'"]');
  chip.classList.add('placed'); chip.classList.remove('rc-active');
  const drop=document.getElementById('drop'+bin);
  drop.insertAdjacentHTML('beforeend','<span class="pl '+(correct?'ok':'bad')+'">'+it.t+(correct?' ✓':' ✗')+'</span>');
  rcActive=null; rcDone++;
  const msg=document.getElementById('rcMsg');
  if(!correct){ msg.innerHTML='<span style="color:var(--rose)">Hmm — "'+it.t+'" is actually <b>'+(it.r==='high'?'high':'low')+' cost</b>. '+(it.r==='high'?'Irreversible or sensitive → ask first.':'Read-only/reversible → safe to auto-run.')+'</span>'; }
  else { msg.innerHTML='<span style="color:var(--green)">Correct.</span> '; }
  if(rcDone===RC_ITEMS.length){
    msg.innerHTML+=' <b>All sorted.</b> That sort you just did is exactly what you encode as your approval policy — and in LangGraph, the "ask me first" pile becomes interrupt() calls.';
  }
}

/* ---- L6: graph tracer ---- */
const GT_NODES = [
  {id:'start', t:'START', nt:'entry', x:24, y:20},
  {id:'research', t:'research', nt:'node', x:24, y:90},
  {id:'ideate', t:'ideate', nt:'node', x:24, y:160},
  {id:'route', t:'needs legal?', nt:'conditional edge', x:24, y:230},
  {id:'legal', t:'legal review', nt:'node', x:200, y:230},
  {id:'end', t:'END', nt:'exit', x:24, y:300},
];
const GT_STEPS = [
  {node:'start', log:'Run begins. The shared state is mostly empty.', state:{brief:'"Launch the spring skincare line"', research:'…', concepts:'[ ]', approved:'—'}},
  {node:'research', log:'research node runs → writes findings into state.research.', state:{brief:'"Launch the spring skincare line"', research:'"Gen-Z values clean ingredients…"', concepts:'[ ]', approved:'—', _upd:['research']}},
  {node:'ideate', log:'ideate node runs → APPENDS a concept (reducer = add, so it accumulates).', state:{brief:'"Launch the spring skincare line"', research:'"Gen-Z values clean ingredients…"', concepts:'["Bare Skin, Bold You"]', approved:'—', _upd:['concepts']}},
  {node:'route', log:'CONDITIONAL EDGE: the router reads state. The concept makes a skin-health claim → route to legal.', state:{brief:'"Launch the spring skincare line"', research:'"Gen-Z values clean ingredients…"', concepts:'["Bare Skin, Bold You"]', approved:'—'}},
  {node:'legal', log:'legal node runs → writes approved=true into state.', state:{brief:'"Launch the spring skincare line"', research:'"Gen-Z values clean ingredients…"', concepts:'["Bare Skin, Bold You"]', approved:'true', _upd:['approved']}},
  {node:'end', log:'Reached END. Final state is returned. ✅', state:{brief:'"Launch the spring skincare line"', research:'"Gen-Z values clean ingredients…"', concepts:'["Bare Skin, Bold You"]', approved:'true'}},
];
let gtStep=-1;
MOUNTS.graphs = () => {
  gtStep=-1;
  const m=document.getElementById('gtMount');
  const nodesHtml = GT_NODES.map(n=>'<div class="gt-node" id="gt-'+n.id+'" style="left:'+n.x+'px;top:'+n.y+'px"><div class="nt">'+n.nt+'</div>'+n.t+'</div>').join('');
  m.innerHTML='<div class="gt-wrap">'
    +'<div><div class="gt-canvas" id="gtCanvas"><svg class="gt-svg" id="gtSvg"></svg>'+nodesHtml+'</div>'
    +'<div class="gt-controls"><button class="btn sm" id="gtBtn" onclick="gtNext()">▶ Step through it</button>'
    +'<button class="btn ghost sm" onclick="MOUNTS.graphs()">↻ Reset</button></div>'
    +'<div class="gt-log" id="gtLog">Press “Step through it” to run the campaign workflow one node at a time.</div></div>'
    +'<div><div style="font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Shared state (the whiteboard)</div>'
    +'<div class="gt-state" id="gtState"></div></div></div>';
  drawGtEdges(); renderGtState(GT_STEPS[0].state, true);
};
function drawGtEdges(){
  const svg=document.getElementById('gtSvg');
  const edges=[['start','research'],['research','ideate'],['ideate','route'],['route','legal'],['route','end'],['legal','end']];
  const cx=n=>{const e=GT_NODES.find(x=>x.id===n);return {x:e.x+55,y:e.y+22}};
  let p='';
  edges.forEach(e=>{const a=cx(e[0]),b=cx(e[1]);
    p+='<line x1="'+a.x+'" y1="'+(a.y+12)+'" x2="'+b.x+'" y2="'+(b.y-12)+'" stroke="#c9c2b4" stroke-width="2"'+(e[0]==='route'?' stroke-dasharray="4 3"':'')+'/>';
  });
  svg.innerHTML=p;
}
function renderGtState(st, fresh){
  const el=document.getElementById('gtState'); if(!el) return;
  let h='{<br>';
  Object.keys(st).filter(k=>k[0]!=='_').forEach(k=>{
    const upd = !fresh && st._upd && st._upd.includes(k);
    h+='&nbsp;&nbsp;<span class="sk">"'+k+'"</span>: <span class="sv'+(upd?' upd':'')+'">'+st[k]+'</span>,<br>';
  });
  h+='}';
  el.innerHTML=h;
}
function gtNext(){
  gtStep++;
  if(gtStep>=GT_STEPS.length){ gtStep=GT_STEPS.length-1; return; }
  const s=GT_STEPS[gtStep];
  document.querySelectorAll('.gt-node').forEach(n=>n.classList.remove('on'));
  for(let i=0;i<gtStep;i++){ const prev=document.getElementById('gt-'+GT_STEPS[i].node); if(prev)prev.classList.add('done'); }
  const cur=document.getElementById('gt-'+s.node); if(cur){cur.classList.add('on');cur.classList.remove('done');}
  document.getElementById('gtLog').innerHTML='<b>Step '+(gtStep+1)+'/'+GT_STEPS.length+':</b> '+s.log;
  renderGtState(s.state,false);
  const btn=document.getElementById('gtBtn');
  if(gtStep===GT_STEPS.length-1){ btn.textContent='✓ Done'; btn.disabled=true; }
}

/* ---- L7: orchestration simulator ---- */
const OS_AGENTS=[
  {id:'res', n:'Researcher', r:'gathers facts', av:'🔎', c:'#0e8f8a'},
  {id:'wri', n:'Writer', r:'drafts copy', av:'✍️', c:'#5a3cf0'},
  {id:'cri', n:'Critic', r:'gives feedback', av:'🧐', c:'#c8366b'},
];
const OS_SCRIPTS = {
  rr:{label:'Round-robin', intro:'Fixed rotation. No AI decides — they just take turns in order until the message cap.',
    steps:[
      {sys:'Termination set: stop after 6 turns. Fixed order: Researcher → Writer → Critic.'},
      {a:'res', m:'Solar adoption is up 40% YoY; cost is the top objection.'},
      {a:'wri', m:'Draft: "Power your home for less than your coffee habit."'},
      {a:'cri', m:'The hook is strong but "coffee habit" is overused. Sharpen it.'},
      {a:'res', m:'Adding data: avg payback period is now 7 years.'},
      {a:'wri', m:'Revised: "Pays for itself in 7 years. Powers your home for 25."'},
      {a:'cri', m:'That lands. Ship it.'},
      {term:'Reached 6 turns → terminate. Notice: simple, predictable, but it kept rotating even when one agent had nothing new.'}
    ]},
  ai:{label:'AI-driven (group chat)', intro:'An AI selector reads the conversation and picks who is most useful next — order is not fixed.',
    steps:[
      {sys:'Termination: stop when the Critic approves OR after 8 turns.'},
      {sys:'Selector: "Task needs facts first → Researcher."'},
      {a:'res', m:'Solar adoption up 40% YoY; cost is the top objection.'},
      {sys:'Selector: "We have facts → Writer should draft."'},
      {a:'wri', m:'Draft: "Power your home for less than your coffee habit."'},
      {sys:'Selector: "A draft exists → Critic should review."'},
      {a:'cri', m:'Weak cliché in the hook. Needs a concrete number.'},
      {sys:'Selector: "Needs data → back to Researcher, not a blind rotation."'},
      {a:'res', m:'Payback period is 7 years; lifespan 25 years.'},
      {sys:'Selector: "Now Writer can use that number."'},
      {a:'wri', m:'"Pays for itself in 7 years. Powers your home for 25."'},
      {a:'cri', m:'Approved. ✓'},
      {term:'Critic approved → terminate. Notice: it skipped no-op turns and adapted the order. Smarter, but each selection is an extra AI call (cost).'}
    ]},
  plan:{label:'Plan-based', intro:'One orchestrator (the "producer") makes a plan, assigns steps, and checks each result before moving on.',
    steps:[
      {sys:'Producer creates a PLAN: 1) research objections 2) draft hook 3) critique & finalise.'},
      {sys:'Producer → assigns Step 1 to Researcher.'},
      {a:'res', m:'Top objection = cost. Adoption +40% YoY.'},
      {sys:'Producer evaluates Step 1: ✓ sufficient. Assigns Step 2 to Writer (with only the relevant facts).'},
      {a:'wri', m:'Draft: "Power your home for less than your coffee habit."'},
      {sys:'Producer evaluates Step 2: ✗ weak — no concrete number. RETRY with guidance: "include payback data."'},
      {a:'wri', m:'"Pays for itself in 7 years. Powers your home for 25."'},
      {sys:'Producer evaluates: ✓. Assigns Step 3 to Critic.'},
      {a:'cri', m:'Strong and specific. Approved.'},
      {term:'Plan complete → terminate. Notice the metacognition: the producer judged each step and retried a failure. Most powerful, most overhead.'}
    ]},
};
let osPat='rr', osTimer=null;
MOUNTS.orchestration = () => {
  osPat='rr';
  const m=document.getElementById('osMount');
  const pats=Object.keys(OS_SCRIPTS).map(k=>'<button class="os-pat" data-p="'+k+'" onclick="osSel(\''+k+'\')">'+OS_SCRIPTS[k].label+'</button>').join('');
  const agents=OS_AGENTS.map(a=>'<div class="os-agent" id="os-'+a.id+'"><div class="av" style="background:'+a.c+'22">'+a.av+'</div><div class="an">'+a.n+'</div><div class="ar">'+a.r+'</div></div>').join('');
  m.innerHTML='<div class="os-top">'+pats+'<button class="btn sm" id="osRun" style="margin-left:auto" onclick="osRun()">▶ Run</button></div>'
    +'<div id="osIntro" style="font-size:13.5px;color:var(--ink2);margin-bottom:12px"></div>'
    +'<div class="os-agents">'+agents+'</div>'
    +'<div class="os-feed" id="osFeed"></div>';
  osSel('rr');
};
function osSel(k){
  osPat=k; clearInterval(osTimer);
  document.querySelectorAll('.os-pat').forEach(b=>b.classList.toggle('sel',b.dataset.p===k));
  document.getElementById('osIntro').textContent=OS_SCRIPTS[k].intro;
  document.getElementById('osFeed').innerHTML='';
  document.querySelectorAll('.os-agent').forEach(a=>a.classList.remove('active'));
  const btn=document.getElementById('osRun'); btn.disabled=false; btn.textContent='▶ Run';
}
function osRun(){
  clearInterval(osTimer);
  const sc=OS_SCRIPTS[osPat]; const feed=document.getElementById('osFeed');
  feed.innerHTML=''; const btn=document.getElementById('osRun'); btn.disabled=true; btn.textContent='Running…';
  document.querySelectorAll('.os-agent').forEach(a=>a.classList.remove('active'));
  let i=0;
  osTimer=setInterval(()=>{
    if(i>=sc.steps.length){ clearInterval(osTimer); btn.disabled=false; btn.textContent='↻ Run again';
      document.querySelectorAll('.os-agent').forEach(a=>a.classList.remove('active')); return; }
    const s=sc.steps[i]; document.querySelectorAll('.os-agent').forEach(a=>a.classList.remove('active'));
    let html;
    if(s.sys){ html='<div class="os-msg sys">⚙ '+s.m_||s.sys+'</div>'; }
    else if(s.term){ html='<div class="os-msg term">🛑 '+s.term+'</div>'; }
    else { const ag=OS_AGENTS.find(a=>a.id===s.a); document.getElementById('os-'+s.a).classList.add('active');
      html='<div class="os-msg"><div class="who" style="color:'+ag.c+'">'+ag.av+' '+ag.n+'</div>'+s.m+'</div>'; }
    feed.insertAdjacentHTML('beforeend',html); feed.scrollTop=feed.scrollHeight; i++;
  },1300);
}

/* ---- L9: failure diagnostic ---- */
const FD = [
  {sym:'It runs forever and the bill is huge', name:'No termination condition', fix:'The loop has no reliable stop. Add composed termination: a hard cap (max messages/tokens/time) AND a completion signal (an agent calls a "done" tool) AND a human stop. In LangGraph: recursion_limit + an edge to END.', lg:'recursion_limit + END'},
  {sym:'Results are vague and inconsistent', name:'Instructions too thin (failure #1)', fix:'Vague prompts = vague agents. Rewrite instructions as a detailed job description (role, tool-use rules, output format, error handling, "done when…"). Grow them from real eval failures. Cheapest, highest-leverage fix.', lg:'(prompt)'},
  {sym:'It picks the wrong tool, or fumbles tools', name:'Poor / too many tools', fix:'Reliability over breadth — 10 excellent, well-documented, domain-specific tools beat 50 mediocre ones. Too many tools confuse the model and clog context. Improve docstrings; cut redundant tools.', lg:'@tool'},
  {sym:'Quality degrades the longer it runs', name:'Context rot', fix:'The window is overloaded. Apply context engineering: summarise old history, trim bulky tool outputs, retrieve memory selectively. Feed it less, but the right less.', lg:'state trimming'},
  {sym:'It treats risky actions as casually as safe ones', name:'No cost-aware delegation', fix:'To an agent, "delete data" and "search web" look identical. Classify actions by risk and gate high-cost ones behind human approval. In LangGraph: interrupt() before irreversible actions.', lg:'interrupt()'},
  {sym:'We swapped models and it got worse', name:'Instructions don\'t match the model', fix:'Prompts are not portable across models (or even versions). Keep model-specific instruction sets, and A/B test with your eval suite whenever you switch.', lg:'(prompt registry)'},
  {sym:'It repeats the same mistakes every session', name:'No memory / not learning', fix:'It\'s stateless. Add long-term memory (a Store / RAG) so it accumulates knowledge — but only if eval shows the memory overhead actually improves results. Not every agent needs it.', lg:'Store'},
  {sym:'On long tasks it ploughs ahead down a bad path', name:'No metacognition', fix:'It can\'t judge its own progress. Use a plan-based orchestrator that evaluates each step and re-plans/retries on failure (the Lesson 7 pattern).', lg:'create_supervisor'},
  {sym:'I can\'t tell if my changes are helping', name:'No evals (the meta-failure)', fix:'You can\'t optimise what you can\'t measure. Build even a tiny eval: 5–8 test tasks + expected outcomes + a judge. Now every change is a number, not a vibe.', lg:'LangSmith evals'},
  {sym:'It does risky things a human should approve', name:'No human delegation', fix:'Define escalation: rule-based (any payment > $X) or LLM-based ("this mentions legal action — escalate"). Route those to a person via human-in-the-loop.', lg:'interrupt()'},
];
MOUNTS.failure = () => {
  const m=document.getElementById('fdMount');
  const syms=FD.map((f,i)=>'<button class="fd-sym" data-i="'+i+'" onclick="fdSel('+i+')">“'+f.sym+'”</button>').join('');
  m.innerHTML='<div class="fd-grid">'+syms+'</div><div class="fd-ans" id="fdAns"></div>';
};
function fdSel(i){
  const f=FD[i];
  document.querySelectorAll('.fd-sym').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i));
  const a=document.getElementById('fdAns'); a.className='fd-ans show';
  a.innerHTML='<div class="fdname">'+f.name+'</div><p style="font-size:14.5px;color:var(--ink2);margin-bottom:8px">'+f.fix+'</p>'
    +(f.lg&&f.lg[0]!=='('?'<span class="l" style="font-family:var(--mono);font-size:12.5px;color:var(--indigo-ink);background:var(--indigo-soft);padding:2px 8px;border-radius:6px">LangGraph fix → '+f.lg+'</span>':'');
}

/* fix os sys message field name */
Object.values(OS_SCRIPTS).forEach(s=>s.steps.forEach(st=>{ if(st.sys) st.m_=st.sys; }));
</script>
